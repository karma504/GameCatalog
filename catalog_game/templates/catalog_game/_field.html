<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}
  </label>

    {{ field }}
  {% if field.errors %}<p class="field-error" role="alert">{{ field.errors.0 }}</p>{% elif field.help_text %}<p class="helptext">{{ field.help_text }}</p>{% endif %}
</div>
